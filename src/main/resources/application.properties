# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/avenir_bd
spring.datasource.username=postgres
spring.datasource.password=ezepostgre

# Configuración de Hibernate (El que escribe el SQL por nosotros)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080